<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' blob: data:; media-src blob:" />
    <title>猫咪外观工作室</title>
    <style>
      :root {
        --bg: #f3f1ee;
        --panel: #ffffff;
        --ink: #23201d;
        --muted: #756e66;
        --line: #e2ddd6;
        --accent: #1f7a6d;
        --accent-ink: #ffffff;
        --stage-a: #dfeee9;
        --stage-b: #f6efe2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191715;
          --panel: #23211e;
          --ink: #ece8e2;
          --muted: #a39b91;
          --line: #38342f;
          --accent: #5cc4b3;
          --accent-ink: #10201d;
          --stage-a: #24332f;
          --stage-b: #332d24;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--ink);
        font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        display: flex; flex-direction: column;
      }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
      h1 { font-size: 17px; margin: 0; font-weight: 600; }
      h2 { font-size: 12px; margin: 0; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      button {
        font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
        border-radius: 6px; padding: 5px 12px; cursor: pointer;
      }
      button:hover { border-color: var(--muted); }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
      button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: 8px 16px; }
      main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) 310px; gap: 16px; padding: 16px 20px 20px; }
      section { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
      #drop {
        flex: 1; min-height: 220px; border: 2px dashed var(--line); border-radius: 10px; background: var(--panel);
        display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; position: relative; cursor: pointer;
      }
      #drop.over { border-color: var(--accent); }
      #drop p { margin: 0; color: var(--muted); padding: 24px; max-width: 26em; }
      #drop strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }
      #photo { max-width: 100%; max-height: 100%; display: block; }
      #photo.picking { cursor: crosshair; }
      #video-bar { display: flex; gap: 10px; align-items: center; }
      #video-bar input { flex: 1; min-width: 0; }
      #status { margin: 0; color: var(--muted); min-height: 3em; }
      #palette { display: flex; flex-wrap: wrap; gap: 8px; }
      .swatch { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; }
      .swatch i { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line); display: block; }
      #stage {
        flex: 1; min-height: 260px; border-radius: 10px; overflow: hidden; cursor: grab; touch-action: none;
        background: linear-gradient(180deg, var(--stage-a), var(--stage-b));
      }
      #stage:active { cursor: grabbing; }
      .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; color: var(--muted); }
      .controls { overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; gap: 18px; }
      .group { display: flex; flex-direction: column; gap: 8px; }
      .row { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) auto; gap: 8px; align-items: center; }
      .row input[type="range"] { width: 100%; min-width: 0; }
      .row input[type="color"] { width: 100%; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
      .row .pick { padding: 3px 8px; font-size: 12px; }
      .checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
      .checks label { display: flex; gap: 6px; align-items: center; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: auto; }
      #saved { color: var(--muted); }
      @media (max-width: 980px) {
        body { height: auto; }
        main { grid-template-columns: minmax(0, 1fr); }
        #stage { min-height: 320px; }
        .controls { overflow: visible; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>猫咪外观工作室</h1>
      <div class="chips" id="presets"><h2>预设</h2></div>
    </header>
    <main>
      <section>
        <h2>照片或视频</h2>
        <div id="drop" tabindex="0" role="button" aria-label="选择或拖入照片、视频">
          <p id="drop-hint"><strong>把猫的照片或视频拖到这里</strong>也可以点击选择文件。猫在画面中间、光线均匀的照片效果最好。</p>
          <canvas id="photo" hidden></canvas>
        </div>
        <input type="file" id="file" accept="image/*,video/*" hidden />
        <div id="video-bar" hidden>
          <input type="range" id="seek" min="0" max="1" step="0.01" value="0" aria-label="视频时间" />
          <button type="button" id="reanalyze">分析这一帧</button>
        </div>
        <p id="status">还没有照片。可以先用上面的预设,或直接在右边调颜色。</p>
        <div id="palette"></div>
      </section>

      <section>
        <h2>预览</h2>
        <div id="stage"></div>
        <div class="bar">
          <span>按住拖动可以旋转</span>
          <button type="button" id="walk" aria-pressed="true">走路</button>
        </div>
      </section>

      <section class="controls">
        <div class="group" id="colors"><h2>颜色</h2></div>
        <div class="group">
          <h2>花纹</h2>
          <div class="chips" id="patterns"></div>
          <div class="row"><label for="s-belly">白肚皮</label><input type="range" id="s-belly" min="0" max="1" step="0.01" /><span></span></div>
          <div class="checks">
            <label><input type="checkbox" id="k-socks" />白手套</label>
            <label><input type="checkbox" id="k-muzzle" />白嘴套</label>
          </div>
        </div>
        <div class="group" id="shape"><h2>体型</h2></div>
        <div class="actions">
          <button type="button" class="primary" id="apply">应用到桌面猫</button>
          <button type="button" id="reset">重置</button>
          <span id="saved" role="status"></span>
        </div>
      </section>
    </main>
    <video id="video" muted playsinline hidden></video>
    <script src="../../dist/studio.js"></script>
  </body>
</html>
