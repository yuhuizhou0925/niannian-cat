<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>定制猫爬架</title>
    <style>
      :root {
        --bg: #f3f1ee; --panel: #ffffff; --ink: #23201d; --muted: #756e66; --line: #e2ddd6;
        --accent: #1f7a6d; --accent-ink: #ffffff; --warn: #a8611a; --stage-a: #dfeee9; --stage-b: #f6efe2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191715; --panel: #23211e; --ink: #ece8e2; --muted: #a39b91; --line: #38342f;
          --accent: #5cc4b3; --accent-ink: #10201d; --warn: #e0a55c; --stage-a: #24332f; --stage-b: #332d24;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--ink);
        font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        display: grid; grid-template-columns: 190px minmax(0, 1fr) 340px; gap: 16px; padding: 16px;
      }
      h1 { font-size: 17px; margin: 0; font-weight: 600; }
      h2 { font-size: 12px; margin: 0; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; }
      #stage { border-radius: 10px; overflow: hidden; min-height: 300px; background: linear-gradient(180deg, var(--stage-a), var(--stage-b)); }
      nav { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; }
      nav .item { text-align: left; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
      nav .item[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
      nav .item small { color: var(--muted); }
      nav .item .on { color: var(--accent); font-weight: 600; }
      .name { width: 100%; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
      .kinds { display: flex; gap: 4px; }
      .kinds button { padding: 2px 9px; font-size: 12px; }
      .kinds button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
      aside { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
      p { margin: 0; color: var(--muted); }
      button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
      button:hover { border-color: var(--muted); }
      button:disabled { opacity: 0.45; cursor: default; }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: 8px 16px; }
      #layers { display: flex; flex-direction: column; gap: 10px; }
      .layer { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
      .layer header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
      .layer .remove { padding: 2px 8px; font-size: 12px; }
      .row { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) 3em; gap: 8px; align-items: center; }
      .row input[type="range"] { width: 100%; min-width: 0; }
      .row input[type="color"] { width: 100%; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
      .row output { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
      .warn { color: var(--warn); font-size: 13px; }
      .check { display: flex; gap: 6px; align-items: center; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: auto; }
      #saved { color: var(--muted); flex-basis: 100%; }
      @media (max-width: 860px) { body { grid-template-columns: minmax(0, 1fr); height: auto; } #stage { min-height: 360px; } }
    </style>
  </head>
  <body>
    <nav aria-label="我的猫爬架">
      <h2>我的猫爬架</h2>
      <div id="list" style="display: flex; flex-direction: column; gap: 8px"></div>
      <button type="button" id="new">复制当前这个</button>
      <button type="button" id="delete">删除当前这个</button>
      <button type="button" id="presets">找回预设</button>
    </nav>
    <div id="stage"></div>
    <aside>
      <h1>定制猫爬架</h1>
      <input class="name" id="name" maxlength="20" aria-label="名字" />
      <p>旁边的猫是用来比大小的。猫会从最低一层开始,一层一层往上跳。</p>
      <h2>大小和透明度</h2>
      <div class="row"><label for="s-size">整体大小</label><input type="range" id="s-size" step="0.01" /><output id="o-size"></output></div>
      <div class="row"><label for="s-opacity">不透明度</label><input type="range" id="s-opacity" step="0.01" /><output id="o-opacity"></output></div>
      <h2>平台</h2>
      <div id="layers"></div>
      <button type="button" id="add">添加一层</button>
      <h2>颜色和配件</h2>
      <div class="row"><label for="c-platform">平台</label><input type="color" id="c-platform" /><span></span></div>
      <div class="row"><label for="c-post">柱子</label><input type="color" id="c-post" /><span></span></div>
      <label class="check"><input type="checkbox" id="k-ball" />顶层下面挂一个小球</label>
      <div class="actions">
        <button type="button" class="primary" id="apply">把这个摆到桌面</button>
        <span id="saved" role="status"></span>
      </div>
    </aside>
    <script src="../../dist/tree.js"></script>
  </body>
</html>
